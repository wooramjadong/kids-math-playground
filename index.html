<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>수학 놀이터 — 7세 · 8세 · 3학년</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="top"><div class="topin">
  <div class="brand display">수학 놀이터</div>
  <div class="spacer"></div>
  <div class="agetog" id="groupTog">
    <button data-g="7">7세<br><small style="font-weight:400">입학 준비</small></button>
    <button data-g="8">8세<br><small style="font-weight:400">1학년</small></button>
    <button data-g="3">3학년<br><small style="font-weight:400">2학기</small></button>
  </div>
  <div class="starbank" title="쓸 수 있는 별">⭐ <b id="totalStars">0</b></div>
  <button class="iconbtn" id="voiceBtn" title="읽어주기 켜기/끄기">🔊</button>
</div></header>

<main>
  <section id="home" class="screen">
    <div class="hero">
      <h1 class="display" id="heroTitle"></h1>
      <p id="heroDesc"></p>
      <div class="legend" id="legend"></div>
      <div class="stickers" id="stickers"></div>
    </div>
    <div class="cardplay" id="cardplay"></div>
    <div class="modes" id="modes"></div>
  </section>

  <section id="levels" class="screen hidden">
    <button class="back" onclick="goHome()">← 홈으로</button>
    <div class="card" style="margin-top:8px">
      <h2 class="display" id="levelTitle" style="margin:0;font-size:30px"></h2>
      <p id="levelDesc" style="color:var(--ink-soft);margin:4px 0 0;font-size:14px"></p>
      <div class="levels" id="levelList"></div>
    </div>
  </section>

  <section id="play" class="screen hidden">
    <div class="playbar">
      <button class="back" onclick="confirmHome()">← 그만</button>
      <div class="progress" id="progress"></div>
      <div class="timer hidden" id="timer">60</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="card qcard">
      <div id="tagline"></div>
      <div class="prompt"><span class="txt" id="prompt"></span><button class="speak" id="speakBtn" title="다시 읽어주기">🔊</button></div>
      <div class="visual" id="visual"></div>
      <div class="answer" id="answer"></div>
      <div id="feedback"></div>
    </div>
    <div class="numpad hidden" id="numpad"></div>
  </section>

  <section id="result" class="screen hidden">
    <div class="card result" id="resultCard"></div>
  </section>

  <section id="lab" class="screen hidden">
    <button class="back" onclick="showLevels('frac')">← 뒤로</button>
    <div class="card lab" style="margin-top:8px">
      <h2 class="display" style="margin:0 0 4px;font-size:30px">분수 실험실 · 직접 만들기</h2>
      <p style="margin:0;color:var(--ink-soft);font-size:14px">분모와 분자를 바꿔 보면서 조각이 어떻게 변하는지 살펴보세요.</p>
      <div class="controls">
        <label>분모 <input type="range" id="labD" min="1" max="12" value="4"> <span class="val" id="labDv">4</span></label>
        <label>분자 <input type="range" id="labN" min="0" max="16" value="3"> <span class="val" id="labNv">3</span></label>
        <div class="seg"><button class="on" data-shape="pie">🍕 원</button><button data-shape="bar">🍫 막대</button></div>
      </div>
      <div class="visual" id="labVisual"></div>
      <div class="rep" id="labRep"></div>
      <div class="read" id="labRead"></div>
    </div>
  </section>
</main>

<script src="app.js?v=2"></script>
</body>
</html>
